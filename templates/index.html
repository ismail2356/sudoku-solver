<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Çözücü</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Sudoku Çözücü</h1>
        <p class="description">
            Çözmek istediğiniz Sudoku bulmacasının fotoğrafını yükleyin.<br>
            Yapay zeka destekli sistemimiz rakamları tanıyıp çözümü bulacaktır.
        </p>
        
        <form action="/detect" method="post" enctype="multipart/form-data" id="upload-form">
            <div class="upload-area" id="drop-zone">
                <input type="file" name="file" id="file-input" accept="image/*" required hidden>
                <div class="upload-content">
                    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>Resmi sürükleyip bırakın veya tıklayıp seçin</p>
                    <span class="file-name"></span>
                </div>
            </div>
            <button type="submit" class="button solve-button">Rakamları Tanı</button>
        </form>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName = document.querySelector('.file-name');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        });

        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            if (fileInput.files.length > 0) {
                fileName.textContent = fileInput.files[0].name;
            }
        }
    </script>
</body>
</html>
